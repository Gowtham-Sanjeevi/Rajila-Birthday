<html lang="en">

<head>

    <!-- ========================================= -->
    <!-- BASIC HTML SETTINGS -->

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday Rajila 💗</title>

    <meta name="description"
          content="A special birthday surprise from Gowtham 💖">


    <!-- ========================================= -->
    <!-- WHATSAPP / FACEBOOK / OPEN GRAPH -->
    <!-- ========================================= -->

    <meta property="og:type"
          content="website">

    <meta property="og:title"
          content="Happy Birthday Rajila 💗">

    <meta property="og:description"
          content="A special birthday surprise from Gowtham 💖">

    <meta property="og:url"
          content="https://gowtham-sanjeevi.github.io/Rajila-Birthday/">

    <meta property="og:site_name"
          content="Rajila's Birthday">

    <meta property="og:image"
          content="https://gowtham-sanjeevi.github.io/Rajila-Birthday/thumbnail.png">

    <meta property="og:image:secure_url"
          content="https://gowtham-sanjeevi.github.io/Rajila-Birthday/thumbnail.png">

    <meta property="og:image:type"
          content="image/png">

    <meta property="og:image:width"
          content="1200">

    <meta property="og:image:height"
          content="630">

    <meta property="og:image:alt"
          content="Happy Birthday Rajila 💗">


    <!-- ========================================= -->
    <!-- TWITTER / X -->
    <!-- ========================================= -->

    <meta name="twitter:card"
          content="summary_large_image">

    <meta name="twitter:title"
          content="Happy Birthday Rajila 💗">

    <meta name="twitter:description"
          content="A special birthday surprise from Gowtham 💖">

    <meta name="twitter:image"
          content="https://gowtham-sanjeevi.github.io/Rajila-Birthday/thumbnail.png">

    <meta name="twitter:image:alt"
          content="Happy Birthday Rajila 💗">


    <!-- ========================================= -->
    <!-- GENERAL IMAGE PREVIEW -->
    <!-- ========================================= -->

    <link rel="image_src"
          href="https://gowtham-sanjeevi.github.io/Rajila-Birthday/thumbnail.png">


    <!-- ========================================= -->
    <!-- FAVICON -->
    <!-- ========================================= -->

    <link rel="icon"
          type="image/png"
          href="favicon.png">


    <!-- ========================================= -->
    <!-- GOOGLE FONT -->
    <!-- ========================================= -->

    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&display=swap"
        rel="stylesheet">


    <!-- ========================================= -->
    <!-- PRELOAD IMAGES -->
    <!-- ========================================= -->

    <link rel="preload"
          as="image"
          href="photo-1.jpg">

    <link rel="preload"
          as="image"
          href="photo-2.jpg">

    <link rel="preload"
          as="image"
          href="photo-3.jpg">

    <link rel="preload"
          as="image"
          href="gif1.gif">

    <link rel="preload"
          as="image"
          href="gif2.gif">


    <!-- ========================================= -->
    <!-- PRELOAD MUSIC -->
    <!-- ========================================= -->

    <link rel="preload"
          as="audio"
          href="hbd.mp3">


    <!-- ========================================= -->
    <!-- GSAP -->
    <!-- ========================================= -->

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js">
    </script>


    <!-- ========================================= -->
    <!-- WEBSITE CSS -->
    <!-- ========================================= -->

    <link rel="stylesheet"
          href="home.css">

</head>


<body>


    <!-- ========================================= -->
    <!-- LOADING SCREEN -->
    <!-- ========================================= -->

    <div id="loading-screen"
         class="loading-screen">

        <div class="loading-heart">
            💖
        </div>

        <div class="loading-text">
            Loading magic...
        </div>

    </div>


    <!-- ========================================= -->
    <!-- BACKGROUND MUSIC -->
    <!-- ========================================= -->

    <!--
    <audio id="bgMusic" preload="auto">
        <source src="hbd.mp3" type="audio/mpeg">
    </audio>
    -->

    <audio id="birthdayMusicPlayer"
           preload="auto">

        <source
            src="hbd.mp3"
            type="audio/mpeg">

    </audio>


    <!-- ========================================= -->
    <!-- MUSIC TOGGLE -->
    <!-- ========================================= -->

    <div class="music-toggle"
         id="musicToggle"
         title="Toggle Music">

        <span class="music-icon">
            🎵
        </span>

    </div>


    <!-- ========================================= -->
    <!-- CUSTOM CURSOR -->
    <!-- ========================================= -->

    <div class="cursor"></div>


    <!-- ========================================= -->
    <!-- MAIN CONTAINER -->
    <!-- ========================================= -->

    <div class="container">


        <!-- ===================================== -->
        <!-- COUNTDOWN -->
        <!-- ===================================== -->

        <div id="countdown-section"
             class="countdown-section">

            <h2 class="countdown-title">
                Birthday Countdown
            </h2>


            <div class="countdown-timer">


                <!-- DAYS -->

                <div class="countdown-item">

                    <span id="days"
                          class="countdown-number">
                        00
                    </span>

                    <span class="countdown-label">
                        Days
                    </span>

                </div>


                <!-- HOURS -->

                <div class="countdown-item">

                    <span id="hours"
                          class="countdown-number">
                        00
                    </span>

                    <span class="countdown-label">
                        Hours
                    </span>

                </div>


                <!-- MINUTES -->

                <div class="countdown-item">

                    <span id="minutes"
                          class="countdown-number">
                        00
                    </span>

                    <span class="countdown-label">
                        Minutes
                    </span>

                </div>


                <!-- SECONDS -->

                <div class="countdown-item">

                    <span id="seconds"
                          class="countdown-number">
                        00
                    </span>

                    <span class="countdown-label">
                        Seconds
                    </span>

                </div>


            </div>

        </div>


        <!-- ===================================== -->
        <!-- BIRTHDAY CONTENT -->
        <!-- ===================================== -->

        <div id="birthday-content"
             class="birthday-content"
             style="display: none;">


            <h1>
                Happy Birthday Rajila💗
            </h1>


            <p class="nickname-text">
                To my favorite birthday girl 💕
            </p>


            <div class="greeting"></div>


            <p class="from-text">
                - From Gowtham 💙
            </p>


            <button class="cta-button">
                Click to Enter 💕
            </button>


        </div>


    </div>


    <!-- ========================================= -->
    <!-- WEBSITE JAVASCRIPT -->
    <!-- ========================================= -->

    <script src="home.js"></script>

    <script src="music.js"></script>


</body>

</html>
